name: Deploy Day Zero to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify sync API
        env:
          SYNC_API_BASE_URL: https://day-zero-precise-days-counter.ai.studio
        run: curl --fail --silent --show-error "$SYNC_API_BASE_URL/api/health"

      - name: Verify GitHub Pages CORS
        if: github.event_name != 'pull_request'
        env:
          SYNC_API_BASE_URL: https://day-zero-precise-days-counter.ai.studio
        run: |
          headers=$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS "$SYNC_API_BASE_URL/api/sync/save" \
            --header 'Origin: https://starforge369.github.io' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type')
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep --ignore-case --fixed-strings 'Access-Control-Allow-Origin: https://starforge369.github.io'

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
          VITE_SYNC_API_BASE_URL: https://day-zero-precise-days-counter.ai.studio
        run: bun run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
